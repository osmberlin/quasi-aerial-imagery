version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /viewer
    schedule:
      interval: cron
      cronjob: '0 7 * * THU#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    exclude-paths:
      - .claude/**
      - .cursor/**
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  - package-ecosystem: pip
    directories:
      - /pipelines
      - /pipelines/2-masks/anonymise
      - /pipelines/2-masks/segment
      - /pipelines/2-masks/helmet-mask
    schedule:
      interval: cron
      cronjob: '0 7 * * THU#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
